<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who's Al Ghifary</title>

  <!-- Font Google -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- CSS External -->
  <link rel="stylesheet" href="styles.css" />
</head>
  <script>
const WORKER_URL = 'https://masmasbiasa.bacok-fary.workers.dev';

async function sendQuestion() {
  const input = document.getElementById('questionInput');
  const messages = document.getElementById('messages');
  const question = input.value.trim();

  if (!question) return;

  const safeQuestion = question
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  messages.innerHTML += `<div class="user-msg">You : ${safeQuestion}</div>`;
  input.value = '';
  messages.scrollTop = messages.scrollHeight;

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question })
    });

    const data = await response.json();

    const safeReply = (data.reply || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    messages.innerHTML += `<div class="ai-msg">Zenithra👧🏻: ${safeReply}</div>`;
    messages.scrollTop = messages.scrollHeight;

  } catch (err) {
    messages.innerHTML += `<div class="ai-msg">Zenithra👧🏻: Failed to connect to AI service.</div>`;
    messages.scrollTop = messages.scrollHeight;
  }
}
</script>
  <script>
// tombol saran otomatis mengisi input
document.querySelectorAll('.suggestion-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('questionInput').value = btn.textContent;
    document.getElementById('questionInput').focus();
  });
});
</script>
<body>

  <section class="hero">
    <div class="container">

      <!-- Teks kiri -->
      <div class="left-text">
        Who Is<br>This Guy?
      </div>

      <!-- Foto tengah -->
      <div class="profile-wrapper">
        <div class="profile-card">
          <img src="mypt.png" alt="Foto Profil">
        </div>
      </div>

      <!-- Form kanan -->
      <div class="right-box">
        <h2>Ask me!</h2>
        <p class="description">If you have any questions, feel free to ask me anything. My assistant will do her best to answer your questions.</p>
        <p class="description">Maybe you can try to ask "Who is this handsome guy?😏"</p>

<form class="ask-form" onsubmit="event.preventDefault(); sendQuestion();">
  <input id="questionInput" type="text" placeholder="Ask me anything..." required>
  <button type="submit">Send</button>
</form>

<div id="messages" class="messages"></div>
      </div>

    </div>
  </section>

</body>
</html>
