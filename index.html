<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>

  <!-- Font Google -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- CSS External -->
  <link rel="stylesheet" href="styles.css" />
</head>
  <script>
const WORKER_URL = 'https://masmasbiasa.bacok-fary.workers.dev/';

// tombol saran otomatis mengisi input
document.querySelectorAll('.suggestion-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('questionInput').value = btn.textContent;
  });
});

async function sendQuestion() {
  const input = document.getElementById('questionInput');
  const messages = document.getElementById('messages');
  const question = input.value.trim();

  if (!question) return;

  messages.innerHTML += `<div class="user-msg">🧑 ${question}</div>`;
  input.value = '';

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question })
    });

    const data = await response.json();

    messages.innerHTML += `<div class="ai-msg">🤖 ${data.reply}</div>`;
    messages.scrollTop = messages.scrollHeight;

  } catch (err) {
    messages.innerHTML += `<div class="ai-msg">⚠️ Failed to connect to AI service.</div>`;
  }
}
</script>
<body>

  <section class="hero">
    <div class="container">

      <!-- Teks kiri -->
      <div class="left-text">
        Who Is<br>This Guy?
      </div>

      <!-- Foto tengah -->
      <div class="profile-wrapper">
        <div class="profile-card">
          <img src="mypt.png" alt="Foto Profil">
        </div>
      </div>

      <!-- Form kanan -->
      <div class="right-box">
        <h2>Ask me!</h2>
        <p class="description">If you have any questions, feel free to ask me anything. I will do my best to answer your questions.</p>

<form class="ask-form" onsubmit="event.preventDefault(); sendQuestion();">
  <input id="questionInput" type="text" placeholder="Ask me anything..." required>
  <button type="submit">Send</button>
</form>

<div id="messages" class="messages"></div>

    <!-- Saran pertanyaan -->
    <div class="suggestions">
      <p class="suggestion-title">In case u dont have anything to ask:</p>

      <div class="suggestion-buttons">
        <button type="button" class="suggestion-btn">How old are you?</button>
        <button type="button" class="suggestion-btn">What is your name?</button>
        <button type="button" class="suggestion-btn">Where are you from?</button>
        <button type="button" class="suggestion-btn">What do you study?</button>
        <button type="button" class="suggestion-btn">What are your hobbies?</button>
        <button type="button" class="suggestion-btn">What is your favorite food?</button>
        <button type="button" class="suggestion-btn">What is your dream job?</button>
        <button type="button" class="suggestion-btn">Tell me about yourself</button>
      </div>

    </div>
  </form>
      </div>

    </div>
  </section>

</body>
</html>
