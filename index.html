  <script>
const WORKER_URL = 'https://masmasbiasa.bacok-fary.workers.dev';

async function sendQuestion() {
  const input = document.getElementById('questionInput');
  const messages = document.getElementById('messages');
  const question = input.value.trim();

  if (!question) return;

  // Pesan user
  const userDiv = document.createElement('div');
  userDiv.className = 'user-msg';
  userDiv.textContent = 'You : ' + question;
  messages.appendChild(userDiv);

  input.value = '';

  // Scroll ke bawah
  requestAnimationFrame(() => {
    messages.scrollTop = messages.scrollHeight;
  });

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question })
    });

    const data = await response.json();

    // Pesan AI
    const aiDiv = document.createElement('div');
    aiDiv.className = 'ai-msg';
    aiDiv.textContent = 'Zenithra👧🏼 : ' + (data.reply || 'No response');
    messages.appendChild(aiDiv);

    requestAnimationFrame(() => {
      messages.scrollTop = messages.scrollHeight;
    });

  } catch (err) {
    const errDiv = document.createElement('div');
    errDiv.className = 'ai-msg';
    errDiv.textContent = 'Zenithra👧🏼 : Failed to connect to AI service.';
    messages.appendChild(errDiv);

    requestAnimationFrame(() => {
      messages.scrollTop = messages.scrollHeight;
    });
  }
}
</script>
